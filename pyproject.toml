[project]
name = "tradey"
version = "0.1.0"
description = "Portfolio rebalancing suggestions from Portfolio Performance exports"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.3",
    "prettytable>=3.17.0",
    "protobuf>=7.34.1",
    "scipy>=1.17.1",
]

[project.scripts]
tradey = "tradey:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["tradey.py", "proto"]

[tool.ruff]
extend-exclude = ["proto/"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "scipy-stubs>=1.17.1.3",
]
